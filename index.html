<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1420" media="(prefers-color-scheme: dark)">
    <script src="js/tema.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Turnos BBE">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Calendario BBE</title>

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="cargando">

<header class="topbar header-fijo-container">
    <div class="topbar-interior">
        <div class="marca cabecera">
            <span class="marca-logo"><img src="img/LOGO_BBE_SOLO.png" class="logoCabecera" alt="BBE"></span>
            <h1>Calendario BBE</h1>
        </div>

        <div class="usuarioCabecera">
            <div id="infoUsuario" role="button" tabindex="0" aria-label="Menú de usuario"></div>
            <button type="button" class="cerrarSesion" onclick="event.stopPropagation(); confirmarCerrarSesion();" aria-label="Cerrar sesión">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Salir</span>
            </button>
        </div>
    </div>
</header>

<div class="contenedor">

    <!-- Menú de usuario desplegable -->
    <div id="panelUsuario" class="panelUsuario" style="display: none;">
        <div class="panel-cabecera">
            <span class="panel-etiqueta">Acceso como</span>
            <span id="rolUsuarioTexto" class="panel-rol-badge">Administrador</span>
        </div>

        <div class="panel-opciones">
            <button id="btnToggleBusqueda" type="button" class="panel-btn-tab" onclick="toggleSeccionPanel('busqueda')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Buscar un día
            </button>
            <button id="btnToggleAnual" type="button" class="panel-btn-tab" onclick="toggleSeccionPanel('anual')">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Calendario anual
            </button>
            <button id="btnMiAnio" type="button" class="panel-btn-tab" onclick="cerrarPanelUsuario(); verMiAnio()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Mi año
            </button>
            <button id="btnEditarCalendario" type="button" class="panel-btn-tab" onclick="activarModoEdicion()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                Editar calendario
            </button>
            <button id="btnHoras" type="button" class="panel-btn-tab" style="display: none;" onclick="verResumen()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Horas
            </button>
            <button id="btnCambios" type="button" class="panel-btn-tab" style="display: none;" onclick="verCambios()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Cambios <span id="globoCambios" class="globo" style="display: none;"></span>
            </button>
            <button id="btnEditarColores" type="button" class="panel-btn-tab" onclick="verEditorColores()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.9-4.5-9-10-9z"/></svg>
                Editar colores
            </button>
            <button id="btnAjustes" type="button" class="panel-btn-tab" onclick="verAjustes()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Ajustes
            </button>
            <!-- Solo administradores (se muestran desde admin.js) -->
            <button id="btnAdminEmpleados" type="button" class="panel-btn-tab solo-admin" style="display: none;" onclick="verGestionAdmin()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Empleados y accesos
            </button>
            <button id="btnAdminHoras" type="button" class="panel-btn-tab solo-admin" style="display: none;" onclick="verHorasAdmin()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Horas y convenio
            </button>
            <button id="btnAdminFestivos" type="button" class="panel-btn-tab solo-admin" style="display: none;" onclick="verGestionFestivos()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                Festivos
            </button>
            <button id="btnAdminIntensivas" type="button" class="panel-btn-tab solo-admin" style="display: none;" onclick="verGestionIntensivas()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                Intensivas
            </button>
        </div>

        <div id="seccionBusqueda" class="panel-subseccion" style="display: none;">
            <div class="panel-controles">
                <input type="date" id="fecha" aria-label="Fecha a buscar">
                <button type="button" class="panel-btn" onclick="ejecutarBusquedaDesdeMenu()">Buscar</button>
            </div>
        </div>

        <div id="seccionAnual" class="panel-subseccion" style="display: none;">
            <div class="panel-controles">
                <select id="colectivoAnual" aria-label="Colectivo"></select>
                <select id="anioAnualSelect" class="select-anio" aria-label="Año"></select>
                <button type="button" class="panel-btn" onclick="verCalendarioDesdeMenu()">Ver anual</button>
            </div>
        </div>
    </div>

    <main class="layout">
        <section id="resumenHoy" class="card hoy" hidden></section>

        <div class="principal">
            <div class="card" id="cardCalendario">
                <h2 class="solo-lectores">Mi calendario</h2>
                <div class="barraMes">
                    <button type="button" class="btn-icono" aria-label="Mes anterior" onclick="mesAnterior()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <h3 id="tituloMes" onclick="mostrarSelectorMes()"></h3>
                    <button type="button" class="btn-icono" aria-label="Mes siguiente" onclick="mesSiguiente()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <div id="selectorMes" class="selectorMes">
                    <select id="mesSelector" aria-label="Mes">
                        <option value="0">Enero</option>
                        <option value="1">Febrero</option>
                        <option value="2">Marzo</option>
                        <option value="3">Abril</option>
                        <option value="4">Mayo</option>
                        <option value="5">Junio</option>
                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>
                        <option value="8">Septiembre</option>
                        <option value="9">Octubre</option>
                        <option value="10">Noviembre</option>
                        <option value="11">Diciembre</option>
                    </select>

                    <select id="anioSelector" aria-label="Año"></select>

                    <div class="accionesMes">
                        <button type="button" class="btn-secundario" onclick="irAHoy()">Hoy</button>
                        <button type="button" onclick="aplicarMes()">Ir</button>
                    </div>
                </div>

                <div id="miCalendario"></div>
            </div>

            <!-- Resultados: búsqueda, calendario anual y menú de administrador -->
            <div id="resultado" class="card" style="display: none;"></div>
        </div>

        <section id="leyenda" class="card leyenda"></section>
    </main>
</div>

<script src="js/usuarios.js"></script>
<script src="js/permisos.js"></script>
<script src="js/datos.js"></script>
<script src="js/turnos.js"></script>
<script src="js/semanas.js"></script>
<script src="js/google.js"></script>
<script src="js/calendario.js"></script>
<script src="js/CalendarioMensual.js"></script>
<script src="js/anio.js"></script>
<script src="js/cambios.js"></script>
<script src="js/horas.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-fechas.js"></script>
<script src="js/edicion.js"></script>
<script src="js/colores.js"></script>
<script src="js/atras.js"></script>
<script src="js/app.js"></script>

</body>
</html>
