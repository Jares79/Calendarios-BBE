<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuadrantes Central</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

h1{
    color:#1f4e79;
}

button{
    padding:10px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
}

input{
    padding:8px;
}

.item{
    padding:8px;
    margin:4px 0;
    border-radius:5px;
}

.manana{
    background:#B3E5FC;
}

.tarde{
    background:#42A5F5;
    color:white;
}

.noche{
    background:#9C27B0;
    color:white;
}

.fiesta{
    background:#E53935;
    color:white;
}

</style>

</head>

<body>

<h1>📅 Cuadrantes Central</h1>

<div class="card">

<input type="date" id="fecha">

<button onclick="consultar()">
Consultar
</button>

</div>

<div id="resultado" class="card">
Selecciona una fecha.
</div>

<script>

const patronJT = [
"F","P","M","M","T","T","N","N",
"F","F","F","I","M","M","T","T","N","N",
"F","F","F","P","P","P","P","I","F","F",
"P","P","P","P","I","F","F","F",
"M","M","T","T","N","N",
"F","F","F","P","M","M","T","T","N","N",
"F","F","F","F","M","M","T","T","N","N",
"F","F","F","P","M","M","T","T","N","N",
"F","F","F","F","M","M","T","T","N","N",
"F","F",
"P","P","P","P","I","F","F",
"P","P","P","P","I","F","F"
];

const patronOP = [
"M","M","T","T","T","F","F",
"F","P","M","M","N","N","N",
"F","F","F","P","M","T","T",
"N","N","F","F","F","M","M",
"T","T","N","N","F","F","F",
"P","P","P","P","I","F","F",
"P","P","P","P","I","F","F"
];

const jefes = [
{name:"Javi",inicio:"2026-03-02"},
{name:"Borja",inicio:"2026-02-02"},
{name:"Peje",inicio:"2026-04-13"},
{name:"Gari",inicio:"2026-03-16"},
{name:"Dani",inicio:"2026-02-16"},
{name:"Asier",inicio:"2026-03-30"},
{name:"David",inicio:"2026-01-19"}
];

const control = [
{name:"Aspi",inicio:"2025-01-13"},
{name:"Lauki",inicio:"2025-01-06"},
{name:"Alias",inicio:"2025-01-20"},
{name:"Pedro",inicio:"2025-02-17"},
{name:"Silva",inicio:"2025-02-03"},
{name:"Hector",inicio:"2025-01-27"},
{name:"Garces",inicio:"2025-02-10"}
];

const campo = [
{name:"Josu",inicio:"2025-01-13"},
{name:"Jose",inicio:"2025-01-06"},
{name:"Jurado",inicio:"2025-01-20"},
{name:"Oscar",inicio:"2025-02-17"},
{name:"Urko",inicio:"2025-02-03"},
{name:"Xabi",inicio:"2025-01-27"},
{name:"Alex",inicio:"2025-02-10"}
];

function diferenciaDias(fecha1, fecha2){
    return Math.floor(
        (fecha1.getTime() - fecha2.getTime()) /
        (1000 * 60 * 60 * 24)
    );
}

function obtenerInfoJT(fecha,inicio){

    let dias = diferenciaDias(
        fecha,
        new Date(inicio)
    );

    let pos =
        ((dias % patronJT.length)
        + patronJT.length)
        % patronJT.length;

    let turno = patronJT[pos];

    if(pos >= 21 && pos <= 27)
        return {texto:"Semana X",clase:"semanax"};

    if(pos >= 28 && pos <= 34)
        return {texto:"Semana Y",clase:"semanay"};

    return convertirTurno(turno);
}

function obtenerInfoOP(fecha,inicio){

    let dias = diferenciaDias(
        fecha,
        new Date(inicio)
    );

    let pos =
        ((dias % patronOP.length)
        + patronOP.length)
        % patronOP.length;

    let turno = patronOP[pos];

    if(pos >= 35 && pos <= 41)
        return {texto:"Semana X",clase:"semanax"};

    if(pos >= 42 && pos <= 48)
        return {texto:"Semana Y",clase:"semanay"};

    return convertirTurno(turno);
}

function convertirTurno(turno){

    switch(turno){

        case "M":
            return {
                texto:"Mañana",
                clase:"manana"
            };

        case "T":
            return {
                texto:"Tarde",
                clase:"tarde"
            };

        case "N":
            return {
                texto:"Noche",
                clase:"noche"
            };

        case "F":
            return {
                texto:"Fiesta",
                clase:"fiesta"
            };

        case "P":
            return {
                texto:"Partida",
                clase:"partida"
            };

        case "I":
            return {
                texto:"Intensiva",
                clase:"intensiva"
            };

        default:
            return {
                texto:turno,
                clase:""
            };
    }
}

function pintar(nombre,info){

    return `
        <div class="item ${info.clase}">
            ${nombre} → ${info.texto}
        </div>
    `;
}

function agregarResumen(resumen,nombre,turno){

    if(!resumen[turno])
        resumen[turno] = [];

    resumen[turno].push(nombre);
}

function consultar(){

    const valor =
        document.getElementById("fecha").value;

    if(!valor){
        alert("Selecciona una fecha");
        return;
    }

    const fecha =
        new Date(valor + "T00:00:00");

    let resumen = {};

    let html = `
        <h2>Fecha: ${valor}</h2>
    `;

    html += "<h2>👨‍✈️ Jefes de Turno</h2>";

    jefes.forEach(j=>{

        let info =
            obtenerInfoJT(
                fecha,
                j.inicio
            );

        html += pintar(j.name,info);

        agregarResumen(
            resumen,
            j.name,
            info.texto
        );
    });

    html += "<h2>🎛️ Operadores Control</h2>";

    control.forEach(o=>{

        let info =
            obtenerInfoOP(
                fecha,
                o.inicio
            );

        html += pintar(o.name,info);

        agregarResumen(
            resumen,
            o.name,
            info.texto
        );
    });

    html += "<h2>🔧 Operadores Campo</h2>";

    campo.forEach(o=>{

        let info =
            obtenerInfoOP(
                fecha,
                o.inicio
            );

        html += pintar(o.name,info);

        agregarResumen(
            resumen,
            o.name,
            info.texto
        );
    });

    html += "<hr>";
    html += "<h2>📋 Resumen Diario</h2>";

    Object.keys(resumen).forEach(turno=>{

        html += `<h3>${turno}</h3>`;

        resumen[turno].forEach(persona=>{

            html += `• ${persona}<br>`;

        });

    });

    document.getElementById("resultado").innerHTML =
        html;
}

</script>

</body>
</html>
