<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Calendario BBE</title>
</head>

<body>

<body>

<!-- Contenedor superior fijo (Sticky Header) -->
<div class="header-fijo-container">
    <div class="cabecera">
        <div>
            <h1>
                <img src="img/LOGO_BBE_SOLO.png" class="logoCabecera" alt="BBE">
                Calendario BBE
            </h1>
        </div>
    </div>

    <div class="usuarioCabecera" style="cursor: pointer;">
        <div id="infoUsuario"></div>
        <div class="cerrarSesion" onclick="event.stopPropagation(); cerrarSesion();">
            🚪 Cerrar sesión
        </div>
    </div>

    <!-- Panel de usuario desplegable tipo Dashboard (AHORA DENTRO DEL CONTENEDOR FIJO) -->
    <div id="panelUsuario" class="panelUsuario" style="display: none;">
        <!-- Cabecera del panel con el Rol -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
            <span style="font-size: 0.85rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Acceso como:</span>
            <span id="rolUsuarioTexto" class="panel-rol-badge">Administrador</span>
        </div>
        
        <div class="panel-divisor" style="margin: 8px 0;"></div>

        <!-- Contenido en tarjetas Grid compactas -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start;">
            
            <!-- Bloque 1: Búsqueda por día -->
            <div class="panel-seccion" style="background: #f8fafc; padding: 10px 14px; border-radius: 10px; border: 1px solid #e2e8f0;">
                <h3 class="panel-titulo" style="font-size: 0.9rem; margin-bottom: 8px;">🔍 Búsqueda por día</h3>
                <div class="panel-controles" style="display: flex; gap: 8px;">
                    <input type="date" id="fecha" style="flex: 1; min-width: 140px; padding: 6px 10px;">
                    <button class="panel-btn" onclick="ejecutarBusquedaDesdeMenu()" style="padding: 6px 12px;">Buscar</button>
                </div>
            </div>

            <!-- Bloque 2: Calendario Anual -->
            <div class="panel-seccion" style="background: #f8fafc; padding: 10px 14px; border-radius: 10px; border: 1px solid #e2e8f0;">
                <h3 class="panel-titulo" style="font-size: 0.9rem; margin-bottom: 8px;">📅 Calendario Anual</h3>
                <div class="panel-controles" style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <select id="colectivoAnual" style="flex: 1; min-width: 140px; padding: 6px 10px;">
                        <option value="jefes">👨‍✈️ Jefes de Turno (7)</option>
                        <option value="control">🎛️ Operadores de Control (7)</option>
                        <option value="campo">🔧 Operadores de Campo (7)</option>
                        <option value="todos">👥 Todos (21)</option>
                    </select>
                    
                    <select id="anioAnualSelect" class="select-anio" style="width: 75px; padding: 6px 4px;">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                    </select>

                    <button class="panel-btn" onclick="verCalendarioDesdeMenu()" style="padding: 6px 10px;">Ver anual</button>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="card" id="cardCalendario">
    <h2>📅 Mi calendario</h2>
    <div class="barraMes">
        <button onclick="mesAnterior()">◀</button>
        <h3 id="tituloMes" onclick="mostrarSelectorMes()"></h3>
        <button onclick="mesSiguiente()">▶</button>
    </div>
    
    <div id="selectorMes" class="selectorMes">
        <select id="mesSelector">
            <option value="0">Enero</option>
            <option value="1">Febrero</option>
            <option value="2">Marzo</option>
            <option value="3">Abril</option>
            <option value="4">Mayo</option>
            <option value="5">Junio</option>
            <option value="6">Julio</option>
            <option value="7">Agosto</option>
            <option value="8">Septiembre</option>
            <option value="9">Octubre</option>
            <option value="10">Noviembre</option>
            <option value="11">Diciembre</option>
        </select>

        <select id="anioSelector">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
            <option value="2031">2031</option>
            <option value="2032">2032</option>
            <option value="2033">2033</option>
            <option value="2034">2034</option>
            <option value="2035">2035</option>
        </select>

        <div class="accionesMes">
            <button onclick="irAHoy()">📅 Hoy</button>
            <button onclick="aplicarMes()">🎯 Ir</button>
        </div>
    </div>

    <div id="miCalendario"></div>
</div>

<!-- Tarjeta de resultados -->
<div id="resultado" class="card" style="display: none;">
    Selecciona una fecha.
</div>

<script src="js/usuarios.js"></script>
<script src="js/permisos.js"></script>
<script src="js/empleados.js"></script>
<script src="js/turnos.js"></script>
<script src="js/calendario.js"></script>
<script src="js/CalendarioMensual.js"></script>
<script src="js/app.js"></script>

</body>
</html>
