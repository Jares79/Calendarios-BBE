function diferenciaDias(a,b){
    return Math.floor((a-b)/(1000*60*60*24));
}

function obtenerPosicion(fecha,inicio,longitud){

    const dias = diferenciaDias(
        fecha,
        new Date(inicio)
    );

    return ((dias % longitud) + longitud) % longitud;
}

function obtenerTurno(fecha,inicio,patron){

    const pos = obtenerPosicion(
        fecha,
        inicio,
        patron.length
    );

    return patron[pos];
}
