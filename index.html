<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuadrantes Central</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

h1{
    color:#1f4e79;
}

button{
    padding:10px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
}

input{
    padding:8px;
}

.item{
    padding:8px;
    margin:4px 0;
    border-radius:5px;
}

.manana{
    background:#B3E5FC;
}

.tarde{
    background:#42A5F5;
    color:white;
}

.noche{
    background:#9C27B0;
    color:white;
}

.fiesta{
    background:#E53935;
    color:white;
}

</style>

</head>

<body>

<h1>📅 Cuadrantes Central</h1>

<div class="card">

<input type="date" id="fecha">

<button onclick="consultar()">
Consultar
</button>

</div>

<div id="resultado" class="card">
Selecciona una fecha.
</div>

<script>

const patronJT = [
"F","P","M","M","T","T","N","N",
"F","F","F","I","M","M","T","T","N","N",
"F","F","F","P","P","P","P","I","F","F",
"P","P","P","P","I","F","F","F",
"M","M","T","T","N","N",
"F","F","F",
"P","M","M","T","T","N","N",
"F","F","F","F",
"M","M","T","T","N","N",
"F","F","F",
"P","M","M","T","T","N","N",
"F","F","F","F",
"M","M","T","T","N","N",
"F","F",
"P","P","P","P","I","F","F",
"P","P","P","P","I","F","F"
];

const jefes = [
{name:"Javi",inicio:"2026-03-02"},
{name:"Borja",inicio:"2026-02-02"},
{name:"Peje",inicio:"2026-04-13"},
{name:"Gari",inicio:"2026-03-16"},
{name:"Dani",inicio:"2026-02-16"},
{name:"Asier",inicio:"2026-03-30"},
{name:"David",inicio:"2026-01-19"}
];

function diferenciaDias(fecha1, fecha2){

    return Math.floor(
        (fecha1.getTime() - fecha2.getTime())
        /
        (1000 * 60 * 60 * 24)
    );

}

function obtenerTurno(fechaConsulta, fechaInicio){

    let dias = diferenciaDias(
        fechaConsulta,
        new Date(fechaInicio)
    );

    let pos = dias % patronJT.length;

    if(pos < 0){
        pos += patronJT.length;
    }

    return patronJT[pos];

}

function textoTurno(turno){

    switch(turno){

        case "M":
            return "Mañana";

        case "T":
            return "Tarde";

        case "N":
            return "Noche";

        case "F":
            return "Fiesta";

        case "P":
            return "Partida";

        case "I":
            return "Intensiva";

        default:
            return turno;

    }

}

function claseTurno(turno){

    switch(turno){

        case "M":
            return "manana";

        case "T":
            return "tarde";

        case "N":
            return "noche";

        case "F":
            return "fiesta";

        default:
            return "";

    }

}

function consultar(){

    const valor =
        document.getElementById("fecha").value;

    if(!valor){

        alert("Selecciona una fecha");

        return;

    }

    const fecha =
        new Date(valor + "T00:00:00");

    let html =
        "<h2>Jefes de Turno</h2>";

    jefes.forEach(jefe=>{

        const turno =
            obtenerTurno(
                fecha,
                jefe.inicio
            );

        html += `
        <div class="item ${claseTurno(turno)}">
            ${jefe.name} → ${textoTurno(turno)}
        </div>
        `;

    });

    document.getElementById("resultado").innerHTML =
        html;

}

</script>

</body>
</html>
