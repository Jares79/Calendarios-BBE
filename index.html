<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/styles.css">
    
<title>Version de pruebas</title>

</head>

<body>

<h1>📅 Calendario de turnos BBE</h1>
<div id="infoUsuario" class="card"></div>
<div class="card">
<h2>Mi calendario mensual</h2>
 
<input type="month" id="mesUsuario">
 
<button onclick="verMiCalendario()">
Ver calendario
</button>
 
<div id="miCalendario"></div>
</div>
 
<div class="card">
 
<input type="date" id="fecha">
 
<button onclick="consultar()">
Consultar
</button>
<div class="card">

<input type="date" id="fecha">

<button onclick="consultar()">
Consultar
</button>
<br><br>

<select
    id="mes"
    style="
        width:140px;
        height:48px;
        font-size:18px;
        padding:8px;
        box-sizing:border-box;
    ">
    <option value="0">Enero</option>
    <option value="1">Febrero</option>
    <option value="2">Marzo</option>
    <option value="3">Abril</option>
    <option value="4">Mayo</option>
    <option value="5">Junio</option>
    <option value="6">Julio</option>
    <option value="7">Agosto</option>
    <option value="8">Septiembre</option>
    <option value="9">Octubre</option>
    <option value="10">Noviembre</option>
    <option value="11">Diciembre</option>
</select>

<input
    type="number"
    id="anio"
    value="2026"
    min="2025"
    max="2040"
    style="
        width:140px;
        height:48px;
        font-size:18px;
        padding:8px;
        box-sizing:border-box;
    "
>

<button onclick="verCalendario()">
Calendario mensual
</button>
</div>

<div id="resultado" class="card">
Selecciona una fecha.
</div>


<script src="js/usuarios.js"></script>
<script src="js/permisos.js"></script>
<script src="js/empleados.js"></script>
<script src="js/turnos.js"></script>
<script src="js/calendario.js"></script>
<script src="js/CalendarioMensual.js"></script>
<script src="js/app.js"></script>

</body>
</html>
