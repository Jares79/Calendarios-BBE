<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Calendario BBE</title>
</head>

<body>

<!-- Contenedor superior fijo (Sticky puro, sin romper el flujo del DOM) -->
<div class="header-fijo-container">
    <div class="cabecera">
        <div>
            <h1>
                <img src="img/LOGO_BBE_SOLO.png" class="logoCabecera" alt="BBE">
                Calendario BBE
            </h1>
        </div>
    </div>

    <div class="usuarioCabecera" style="cursor: pointer;">
        <div id="infoUsuario"></div>
        <div class="cerrarSesion" onclick="event.stopPropagation(); cerrarSesion();">
            🚪 Cerrar sesión
        </div>
    </div>
</div>

<!-- Panel de usuario desplegable FUERA de la cabecera fija para evitar bloqueos de scroll -->
<div id="panelUsuario" class="panelUsuario" style="display: none;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.8rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Acceso como:</span>
            <span id="rolUsuarioTexto" class="panel-rol-badge">Administrador</span>
        </div>
    </div>
    
    <div class="panel-divisor" style="margin: 6px 0 10px 0;"></div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button id="btnToggleBusqueda" type="button" class="panel-btn-tab" onclick="toggleSeccionPanel('busqueda')" style="flex: 1; padding: 8px 12px; font-size: 0.85rem; background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
            🔍 Buscar día
        </button>
        <button id="btnToggleAnual" type="button" class="panel-btn-tab" onclick="toggleSeccionPanel('anual')" style="flex: 1; padding: 8px 12px; font-size: 0.85rem; background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
            📅 Calendario Anual
        </button>
    </div>

   <!-- Sub-sección 1: Búsqueda por día -->
<div id="seccionBusqueda" class="panel-subseccion" style="display: none; background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 6px;">
    <div class="panel-controles" style="display: flex; gap: 8px;">
        <input type="date" id="fecha" style="flex: 1; min-width: 130px; padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem;">
        <!-- Añadimos el cierre del panelUsuario aquí -->
        <button class="panel-btn" onclick="ejecutarBusquedaDesdeMenu()" style="padding: 6px 14px; font-size: 0.85rem; background: #1f4e79; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Buscar</button>
    </div>
</div>

    <!-- Sub-sección 2: Calendario Anual -->
    <div id="seccionAnual" class="panel-subseccion" style="display: none; background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 6px;">
        <div class="panel-controles" style="display: flex; gap: 6px; flex-wrap: wrap;">
            <select id="colectivoAnual" style="flex: 1; min-width: 130px; padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem;">
                <option value="jefes">👨‍✈️ Jefes de Turno (7)</option>
                <option value="control">🎛️ Operadores de Control (7)</option>
                <option value="campo">🔧 Operadores de Campo (7)</option>
                <option value="todos">👥 Todos (21)</option>
            </select>
            
            <select id="anioAnualSelect" class="select-anio" style="width: 75px; padding: 6px 4px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem;">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
            </select>

            <button class="panel-btn" onclick="verCalendarioDesdeMenu()" style="padding: 6px 12px; font-size: 0.85rem; background: #1f4e79; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Ver anual</button>
        </div>
    </div>
</div>

<div class="card" id="cardCalendario">
    <h2>📅 Mi calendario</h2>
    <div class="barraMes">
        <button onclick="mesAnterior()">◀</button>
        <h3 id="tituloMes" onclick="mostrarSelectorMes()"></h3>
        <button onclick="mesSiguiente()">▶</button>
    </div>
    
    <div id="selectorMes" class="selectorMes">
        <select id="mesSelector">
            <option value="0">Enero</option>
            <option value="1">Febrero</option>
            <option value="2">Marzo</option>
            <option value="3">Abril</option>
            <option value="4">Mayo</option>
            <option value="5">Junio</option>
            <option value="6">Julio</option>
            <option value="7">Agosto</option>
            <option value="8">Septiembre</option>
            <option value="9">Octubre</option>
            <option value="10">Noviembre</option>
            <option value="11">Diciembre</option>
        </select>

        <select id="anioSelector">
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
            <option value="2031">2031</option>
            <option value="2032">2032</option>
            <option value="2033">2033</option>
            <option value="2034">2034</option>
            <option value="2035">2035</option>
        </select>

        <div class="accionesMes">
            <button onclick="irAHoy()">📅 Hoy</button>
            <button onclick="aplicarMes()">🎯 Ir</button>
        </div>
    </div>

    <div id="miCalendario"></div>
</div>

<!-- Tarjeta de resultados -->
<div id="resultado" class="card" style="display: none;">
    Selecciona una fecha.
</div>

<script src="js/usuarios.js"></script>
<script src="js/permisos.js"></script>
<script src="js/empleados.js"></script>
<script src="js/turnos.js"></script>
<script src="js/calendario.js"></script>
<script src="js/CalendarioMensual.js"></script>
<script src="js/app.js"></script>

</body>
</html>
