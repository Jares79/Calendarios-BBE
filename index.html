<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuadrantes Central</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

h1{
    color:#1f4e79;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

input{
    padding:8px;
}

.turno{
    padding:8px;
    margin:4px 0;
    border-radius:5px;
}

.M{background:#28a745;color:white;}
.T{background:#fd7e14;color:white;}
.N{background:#007bff;color:white;}
.F{background:#d6d8db;}
.P{background:#6f42c1;color:white;}
.I{background:#ffc107;}

</style>

</head>

<body>

<h1>📅 Cuadrantes Central</h1>

<div class="card">

<h2>Consulta rápida</h2>

<input type="date" id="fecha">

<button onclick="consultar()">
Consultar
</button>

</div>

<div class="card" id="resultado">
Selecciona una fecha.
</div>

<script>

const patronJT=[
"F","P","M","M","T","T","N","N",
"F","F","F","I","M","M","T","T","N","N",
"F","F","F","P","P","P","P","I","F","F",
"P","P","P","P","I","F","F","F",
"M","M","T","T","N","N",
"F","F","F","P","M","M","T","T","N","N",
"F","F","F","F","M","M","T","T","N","N",
"F","F","F","P","M","M","T","T","N","N",
"F","F","F","F","M","M","T","T","N","N",
"F","F",
"P","P","P","P","I","F","F",
"P","P","P","P","I","F","F"
];

const patronOP=[
"M","M","T","T","T","F","F",
"F","P","M","M","N","N","N",
"F","F","F","P","M","T","T",
"N","N","F","F","F","M","M",
"T","T","N","N","F","F","F",
"P","P","P","P","I","F","F",
"P","P","P","P","I","F","F"
];

const jefes=[
{name:"Javi",inicio:"2026-03-02"},
{name:"Borja",inicio:"2026-02-02"},
{name:"Peje",inicio:"2026-04-13"},
{name:"Gari",inicio:"2026-03-16"},
{name:"Dani",inicio:"2026-02-16"},
{name:"Asier",inicio:"2026-03-30"},
{name:"David",inicio:"2026-01-19"}
];

const operadores=[
{name:"Aspi / Josu",inicio:"2025-01-13"},
{name:"Lauki / Jose",inicio:"2025-01-06"},
{name:"Alias / Jurado",inicio:"2025-01-20"},
{name:"Pedro / Oscar",inicio:"2025-02-17"},
{name:"Silva / Urko",inicio:"2025-02-03"},
{name:"Hector / Xabi",inicio:"2025-01-27"},
{name:"Garces / Alex",inicio:"2025-02-10"}
];

function diferenciaDias(fechaA,fechaB){
    return Math.floor(
        (fechaA-fechaB)/(1000*60*60*24)
    );
}

function obtenerTurno(fecha,inicio,patron){

    const fechaInicio=new Date(inicio);

    let dias=diferenciaDias(fecha,fechaInicio);

    let posicion=((dias % patron.length)+patron.length)%patron.length;

    return patron[posicion];
}

function pintar(nombre,turno){

    return `
    <div class="turno ${turno}">
        <strong>${nombre}</strong> → ${turno}
    </div>
    `;
}

function consultar(){

    const valor=document.getElementById("fecha").value;

    if(!valor){
        alert("Selecciona una fecha");
        return;
    }

    const fecha=new Date(valor);

    let html=`
    <h2>Fecha consultada</h2>
    <p><strong>${valor}</strong></p>
    `;

    html+="<h2>👨‍✈️ Jefes de Turno</h2>";

    jefes.forEach(jefe=>{
        const turno=obtenerTurno(
            fecha,
            jefe.inicio,
            patronJT
        );

        html+=pintar(jefe.name,turno);
    });

    html+="<h2>🏭 Operadores Control / Campo</h2>";

    operadores.forEach(op=>{

        const turno=obtenerTurno(
            fecha,
            op.inicio,
            patronOP
        );

        html+=pintar(op.name,turno);
    });

    document.getElementById("resultado").innerHTML=html;
}

</script>

</body>
</html>
